<!DOCTYPE html>
<html lang="en">

<head>
  {% include head.html %}
</head>

<body>
  <div class="page-wrap">
    <!-- Sidebar Navigation -->
    <aside class="side-bar">
      {% include sidebar.html %}
    </aside>

    <!-- Main Content Area -->
    <div class="main">
      <!-- Header -->
      {% include header.html %}

      <!-- Page Content -->
      <div class="main-content-wrap">
        <div class="main-content">
          {{ content }}
        </div>
      </div>

      <!-- Footer -->
      {% include footer.html %}
    </div>
  </div>

  <!-- Password Protection Overlay -->
  <style>
    #password-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-base, #0a0a12);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }

    #password-box {
      padding: 2.5rem;
      border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
      border-radius: 16px;
      text-align: center;
      background: var(--glass-bg, rgba(30, 30, 50, 0.7));
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      max-width: 400px;
      width: 90%;
    }

    #password-box h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 1.8rem;
    }

    #password-box p {
      color: var(--text-secondary, #a5a5b8);
      margin-bottom: 1.5rem;
    }

    #password-box input {
      padding: 12px 16px;
      margin-top: 5px;
      width: 100%;
      font-size: 16px;
      background: var(--bg-elevated, #1a1a2e);
      border: 1px solid var(--border-color, rgba(99, 102, 241, 0.2));
      border-radius: 8px;
      color: var(--text-primary, #f0f0f5);
      outline: none;
      transition: all 0.3s ease;
    }

    #password-box input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    #password-box button {
      padding: 12px 24px;
      margin-top: 20px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #password-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
  </style>

  <div id="password-overlay">
    <div id="password-box">
      <h2>Restricted Access</h2>
      <p>Please enter the password to view this site.</p>
      <input type="password" id="site-password" placeholder="Enter password">
      <button onclick="checkPassword()">Unlock Access</button>
      <p id="error-message"
        style="color: #fb7185; display: none; margin-top: 15px; margin-bottom: 0; font-size: 0.9rem;">Incorrect password
      </p>
    </div>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById('site-password').value;
      // hey you find the password :)
      const password = "amita";

      if (input === password) {
        sessionStorage.setItem('site_access_granted', 'true');
        document.getElementById('password-overlay').style.display = 'none';
      } else {
        document.getElementById('error-message').style.display = 'block';
      }
    }

    // Check on load
    document.addEventListener("DOMContentLoaded", function () {
      if (sessionStorage.getItem('site_access_granted') === 'true') {
        document.getElementById('password-overlay').style.display = 'none';
      }
    });

    // Allow Enter key to submit
    document.getElementById('site-password').addEventListener("keypress", function (event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>

  <!-- Mobile Menu Toggle Script -->
  <script src="{{ '/assets/js/navigation.js' | relative_url }}"></script>
</body>

</html>
